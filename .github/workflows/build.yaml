name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '20'
    - name: install deps
      run: |
        # install app deps
        npm install
    - name: build
      run: |
        rm dist/index.js
        make
  # make sure 'build' (above) on main is passing too
  main-branch-check:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: Main branch check
      if: always() && github.ref != 'refs/heads/main' 
      # in this one case we don't use hashes, because otherwise we'd get
      # in a never ending cycle of bumping everytime we merge. :) Since it's
      # our own repo there's no security issues here, we're already running
      # our own code in tests.
      uses: jaymzh/main-branch-check-action@main
      with:
        gh_token: ${{ secrets.GITHUB_TOKEN }}
        main_branch: "main"
        workflow_ref: ${{ github.workflow_ref }}
